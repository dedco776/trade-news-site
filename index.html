    function isMarketOpenNow() {
      const now = new Date();
      const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
      const tashkent = new Date(utcMs + 5 * 60 * 60000);
      const day = tashkent.getDay();
      const hour = tashkent.getHours();
      if (day === 0 || day === 6) return false;
      return hour >= 9 && hour < 18;
    }

      useEffect(() => {
        if (activeTab === 'market') fetchStocks();
        if (activeTab === 'portfolio' && user) fetchPortfolio();
      }, [activeTab, user]);

      async function fetchData(symbol, lang) {
        setLoadingNews(true);
        try {
          const res = await fetch(`/api/news?symbol=${symbol}&lang=${lang}`);
          const data = await res.json();
          if (data.news) setNews(data.news);
          if (data.price) setStockPrice(data.price);
        } catch (err) {
          console.error(err);
        }
        setLoadingNews(false);
      }

      async function getAuthToken() {
        const { data } = await supabase.auth.getSession();
        return data?.session?.access_token || null;
      }

      async function fetchStocks() {
        setLoadingStocks(true);
        try {
          const res = await fetch('/api/stocks');
          const data = await res.json();
          setDemoStocks(data.stocks || []);
        } catch (e) {
          console.error(e);
        }
        setLoadingStocks(false);
      }

      async function fetchPortfolio() {
        setLoadingPortfolio(true);
        try {
          const token = await getAuthToken();
          if (!token) return;
          const res = await fetch('/api/portfolio', { headers: { Authorization: `Bearer ${token}` } });
          const data = await res.json();
          setPortfolio({ balance: data.balance ?? 100, holdings: data.holdings || [] });
        } catch (e) {
          console.error(e);
        }
        setLoadingPortfolio(false);
      }

      async function handleCreateStock(e) {
        e.preventDefault();
        setCreateLoading(true);
        setCreateMsg({ type: '', text: '' });
        try {
          const token = await getAuthToken();
          if (!token) {
            setCreateMsg({ type: 'error', text: t.loginToTrade });
            setCreateLoading(false);
            return;
          }
          const res = await fetch('/api/stocks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify(createForm)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Xatolik');
          setCreateMsg({ type: 'success', text: "Aksiya yaratildi!" });
          setCreateForm({ name: '', ticker: '' });
          fetchStocks();
        } catch (err) {
          setCreateMsg({ type: 'error', text: err.message });
        }
        setCreateLoading(false);
      }

      async function handleTrade(stockId, type) {
        setTradeLoading(stockId + type);
        setTradeMsg({ type: '', text: '' });
        try {
          const token = await getAuthToken();
          if (!token) {
            setTradeMsg({ type: 'error', text: t.loginToTrade });
            setTradeLoading(null);
            return;
          }
          const qty = parseInt(tradeQty[stockId] || '1', 10);
          const res = await fetch('/api/trade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ stock_id: stockId, type, quantity: qty })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Xatolik');
          setTradeMsg({ type: 'success', text: type === 'buy' ? "Sotib olindi!" : "Sotildi!" });
          fetchStocks();
          fetchPortfolio();
        } catch (err) {
          setTradeMsg({ type: 'error', text: err.message });
        }
        setTradeLoading(null);
      }

              password: authForm.password,
              options: { data: { name: authForm.name } }

              setAuthLoading(false);
              return;

            setAuthMessage({ type: 'success', text: "Tizimga kirdingiz!" });

            setShowAuthModal(false);
            setAuthForm({ email: '', password: '', name: '' });

          setAuthMessage({ type: 'error', text: err.message || "Xatolik yuz berdi" });
        } finally {
          setAuthLoading(false);

                <div className="text-[11px] space-y-1 text-slate-300 pt-1">
                  <p><strong className="text-emerald-400">● {t.techLabel}</strong> {t.techText}</p>
                  <p><strong className="text-cyan-400">● {t.fundLabel}</strong> {t.fundText}</p>
                </div>
              </section>

              <section className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
                  <h3 className="text-xs font-bold text-emerald-400 flex items-center gap-2">
                    <i className="fa-solid fa-arrow-trend-up"></i> {t.buyTitle}
                  </h3>
                  <div className="space-y-2">
                    {top5BuyList.map((sym) => (
                      <div
                        key={sym}
                        onClick={() => setCurrentSymbol(sym)}
                        className="bg-slate-900/80 p-2.5 rounded-lg border border-borderDark hover:border-emerald-500/50 hover:bg-slate-900 transition cursor-pointer flex justify-between items-center text-xs"
                      >
                        <span className="font-bold text-slate-200">{sym}</span>
                        <div className="font-mono text-[11px] space-x-2">
                          <span className="text-emerald-400">Entry: ${(stockPrice ? (stockPrice * 0.98).toFixed(2) : '307.06')}</span>
                          <span className="text-cyan-400">TP: ${(stockPrice ? (stockPrice * 1.06).toFixed(2) : '332.13')}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
                  <h3 className="text-xs font-bold text-rose-400 flex items-center gap-2">
                    <i className="fa-solid fa-arrow-trend-down"></i> {t.sellTitle}
                  </h3>
                  <div className="space-y-2">
                    {top5SellList.map((sym) => (
                      <div
                        key={sym}
                        onClick={() => setCurrentSymbol(sym)}
                        className="bg-slate-900/80 p-2.5 rounded-lg border border-borderDark hover:border-rose-500/50 hover:bg-slate-900 transition cursor-pointer flex justify-between items-center text-xs"
                      >
                        <span className="font-bold text-slate-200">{sym}</span>
                        <div className="font-mono text-[11px] space-x-2">
                          <span className="text-rose-400">Entry: ${(stockPrice ? (stockPrice * 1.02).toFixed(2) : '319.60')}</span>
                          <span className="text-slate-400">SL: ${(stockPrice ? (stockPrice * 1.08).toFixed(2) : '338.40')}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              <section className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
                <h2 className="text-xs font-bold text-slate-200 flex items-center gap-2">
                  <i className="fa-solid fa-newspaper text-cyan-400"></i> {t.newsTitle} ({currentSymbol})
                </h2>

                <input
                  type="text"
                  placeholder={t.searchPlaceholder}
                  value={searchInput}
                  onChange={e => setSearchInput(e.target.value)}
                  onKeyDown={handleSearch}
                  className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-emerald-500 transition"
                />

                <div className="space-y-3 pt-2">
                  {loadingNews ? (
                    <p className="text-xs text-slate-400 py-4 text-center"><i className="fa-solid fa-spinner fa-spin mr-1"></i> {t.loading}</p>
                  ) : news.length > 0 ? (
                    news.map((item) => (
                      <div key={item.id} className="p-3 bg-slate-900/60 rounded-lg border border-borderDark space-y-1.5 hover:border-slate-600 transition">
                        <h4 className="font-bold text-xs text-slate-200 leading-snug">{item.headline}</h4>
                        <p className="text-[11px] text-slate-400 leading-relaxed line-clamp-2">{item.summary}</p>
                        <div className="pt-1 flex justify-between items-center text-[10px]">
                          <span className="text-slate-500">{new Date(item.datetime * 1000).toLocaleDateString()}</span>
                          <a href={item.url} target="_blank" rel="noreferrer" className="text-emerald-400 font-semibold hover:underline flex items-center gap-1">
                            {t.readMore} <i className="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                          </a>
                        </div>
                      </div>
                    ))
                  ) : (
                    <p className="text-xs text-slate-500 py-2 text-center">{t.noNews}</p>
                  )}
                </div>
              </section>
            </div>
          )}

          {/* ============ MARKET TAB (Demo Aksiyalar Bozori) ============ */}
          {activeTab === 'market' && (
            <div className="space-y-5 animate-in">

              {/* Market status */}
              <section className={`p-4 rounded-xl border flex items-center justify-between flex-wrap gap-2 ${marketOpen ? 'bg-emerald-500/10 border-emerald-500/40' : 'bg-rose-500/10 border-rose-500/40'}`}>
                <div className="flex items-center gap-2">
                  <span className={`w-2 h-2 rounded-full ${marketOpen ? 'bg-emerald-400 animate-pulse' : 'bg-rose-400'}`}></span>
                  <span className={`text-xs font-bold ${marketOpen ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {marketOpen ? t.marketOpenLabel : t.marketClosedLabel}
                  </span>
                </div>
                <span className="text-[10px] text-slate-400">{t.marketHoursNote}</span>
              </section>

              <p className="text-[10px] text-slate-500 italic px-1">{t.demoNote}</p>

              {/* Create stock */}
              <section className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
                <h3 className="text-xs font-bold text-emerald-400 flex items-center gap-2">
                  <i className="fa-solid fa-plus"></i> {t.createStockTitle}
                </h3>

                {createMsg.text && (
                  <div className={`text-xs p-2.5 rounded-lg border ${createMsg.type === 'error' ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`}>
                    {createMsg.text}
                  </div>
                )}

                {user ? (
                  <form onSubmit={handleCreateStock} className="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <input
                      type="text" required placeholder={t.stockNameLabel}
                      value={createForm.name}
                      onChange={e => setCreateForm({ ...createForm, name: e.target.value })}
                      className="bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-emerald-500 transition md:col-span-1"
                    />
                    <input
                      type="text" required maxLength={6} placeholder={t.tickerLabel}
                      value={createForm.ticker}
                      onChange={e => setCreateForm({ ...createForm, ticker: e.target.value.toUpperCase() })}
                      className="bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-emerald-500 transition md:col-span-1"
                    />
                    <button
                      type="submit" disabled={createLoading}
                      className="bg-emerald-500 hover:bg-emerald-400 disabled:opacity-60 text-slate-950 font-bold py-2 rounded-lg transition text-xs flex items-center justify-center gap-2 md:col-span-1"
                    >
                      {createLoading && <i className="fa-solid fa-spinner fa-spin"></i>}
                      {t.createBtn}
                    </button>
                  </form>
                ) : (
                  <p className="text-xs text-slate-500">{t.loginToTrade}</p>
                )}
              </section>

              {/* All stocks list */}
              <section className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
                <h3 className="text-xs font-bold text-slate-200 flex items-center gap-2">
                  <i className="fa-solid fa-list"></i> {t.allStocksTitle}
                </h3>

                {tradeMsg.text && (
                  <div className={`text-xs p-2.5 rounded-lg border ${tradeMsg.type === 'error' ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`}>
                    {tradeMsg.text}
                  </div>
                )}

                {loadingStocks ? (
                  <p className="text-xs text-slate-400 py-4 text-center"><i className="fa-solid fa-spinner fa-spin mr-1"></i> {t.loading}</p>
                ) : demoStocks.length > 0 ? (
                  <div className="space-y-2">
                    {demoStocks.map((stock) => (
                      <div key={stock.id} className="bg-slate-900/70 p-3 rounded-lg border border-borderDark space-y-2">
                        <div className="flex justify-between items-center">
                          <div>
                            <span className="font-bold text-slate-200 text-xs">{stock.ticker}</span>
                            <span className="text-slate-500 text-[10px] ml-2">{stock.name}</span>
                          </div>
                          <span className="text-emerald-400 font-bold text-sm">${parseFloat(stock.current_price).toFixed(2)}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <input
                            type="number" min="1" max="50" placeholder={t.qtyLabel}
                            value={tradeQty[stock.id] || ''}
                            onChange={e => setTradeQty({ ...tradeQty, [stock.id]: e.target.value })}
                            className="w-20 bg-slate-950 border border-borderDark rounded-lg px-2 py-1.5 text-[11px] text-slate-200 outline-none focus:border-emerald-500 transition"
                          />
                          <button
                            onClick={() => handleTrade(stock.id, 'buy')}
                            disabled={!user || !marketOpen || tradeLoading === stock.id + 'buy'}
                            className="flex-1 bg-emerald-500/20 hover:bg-emerald-500/30 disabled:opacity-40 text-emerald-400 border border-emerald-500/40 py-1.5 rounded-lg text-[11px] font-bold transition"
                          >
                            {t.buyBtn}
                          </button>
                          <button
                            onClick={() => handleTrade(stock.id, 'sell')}
                            disabled={!user || !marketOpen || tradeLoading === stock.id + 'sell'}
                            className="flex-1 bg-rose-500/20 hover:bg-rose-500/30 disabled:opacity-40 text-rose-400 border border-rose-500/40 py-1.5 rounded-lg text-[11px] font-bold transition"
                          >
                            {t.sellBtn}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-xs text-slate-500 py-2 text-center">{t.noStocks}</p>
                )}
              </section>
            </div>
          )}

          {/* ============ PORTFOLIO TAB ============ */}
          {activeTab === 'portfolio' && (
            <div className="space-y-5 animate-in">
              {!user ? (
                <section className="bg-cardDark p-6 rounded-xl border border-borderDark text-center">
                  <p className="text-xs text-slate-500">{t.loginToTrade}</p>
                </section>
              ) : (
                <React.Fragment>
                  <section className="bg-cardDark p-4 rounded-xl border border-emerald-500/40 text-center">
                    <p className="text-[10px] text-slate-400 font-semibold">{t.yourBalance}</p>
                    <p className="text-emerald-400 font-bold text-2xl mt-1">
                      {loadingPortfolio ? <i className="fa-solid fa-spinner fa-spin text-base"></i> : `$${parseFloat(portfolio.balance).toFixed(2)}`}
                    </p>
                  </section>

                  <section className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
                    <h3 className="text-xs font-bold text-slate-200 flex items-center gap-2">
                      <i className="fa-solid fa-briefcase"></i> {t.yourHoldings}
                    </h3>
                    {loadingPortfolio ? (
                      <p className="text-xs text-slate-400 py-4 text-center"><i className="fa-solid fa-spinner fa-spin mr-1"></i> {t.loading}</p>
                    ) : portfolio.holdings.length > 0 ? (
                      <div className="space-y-2">
                        {portfolio.holdings.map((h) => (
                          <div key={h.id} className="bg-slate-900/70 p-3 rounded-lg border border-borderDark flex justify-between items-center">
                            <div>
                              <span className="font-bold text-slate-200 text-xs">{h.user_stocks?.ticker}</span>
                              <span className="text-slate-500 text-[10px] ml-2">{h.quantity} {t.shares}</span>
                            </div>
                            <span className="text-emerald-400 font-bold text-xs">
                              ${(parseFloat(h.quantity) * parseFloat(h.user_stocks?.current_price || 0)).toFixed(2)}
                            </span>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <p className="text-xs text-slate-500 py-2 text-center">{t.noHoldings}</p>
                    )}
                  </section>
                </React.Fragment>
              )}
            </div>
          )}

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-cardDark border border-borderDark rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl relative animate-in">

                <button
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-3 right-3 text-slate-400 hover:text-slate-200 text-sm transition"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center">
                    <i className="fa-solid fa-shield-halved text-emerald-400 text-[10px]"></i>
                  </div>
                  <h3 className="text-sm font-bold text-emerald-400">
                    {isRegistering ? t.authModalTitleReg : t.authModalTitleLogin}
                  </h3>
                </div>

                {authMessage.text && (
                  <div className={`text-xs p-2.5 rounded-lg border animate-in ${
                    authMessage.type === 'error'
                      ? 'bg-rose-500/10 border-rose-500/30 text-rose-400'
                      : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
                  }`}>
                    {authMessage.text}
                  </div>
                )}

                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  {isRegistering && (
                    <div>
                      <label className="text-slate-400 block mb-1">{t.nameLabel}</label>
                      <input
                        type="text"
                        required
                        value={authForm.name}
                        onChange={e => setAuthForm({...authForm, name: e.target.value})}
                        className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-slate-200 outline-none focus:border-emerald-500 transition"
                      />
                    </div>
                  )}

                  <div>
                    <label className="text-slate-400 block mb-1">{t.emailLabel}</label>
                    <input
                      type="email"
                      required
                      value={authForm.email}
                      onChange={e => setAuthForm({...authForm, email: e.target.value})}
                      className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-slate-200 outline-none focus:border-emerald-500 transition"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">{t.passLabel}</label>
                    <input
                      type="password"
                      required
                      minLength={6}
                      value={authForm.password}
                      onChange={e => setAuthForm({...authForm, password: e.target.value})}
                      className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-slate-200 outline-none focus:border-emerald-500 transition"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={authLoading}
                    className="w-full bg-emerald-500 hover:bg-emerald-400 disabled:opacity-60 text-slate-950 font-bold py-2 rounded-lg transition mt-2 flex items-center justify-center gap-2"
                  >
                    {authLoading && <i className="fa-solid fa-spinner fa-spin"></i>}
                    {isRegistering ? t.authModalTitleReg : t.authModalTitleLogin}
                  </button>
                </form>

                <div className="text-center pt-2 border-t border-borderDark">
                  <button
                    onClick={() => { setIsRegistering(!isRegistering); setAuthMessage({ type: '', text: '' }); }}
                    className="text-[11px] text-cyan-400 hover:underline"
                  >
                    {isRegistering ? t.hasAccount : t.noAccount}
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
