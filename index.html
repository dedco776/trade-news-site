<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEDCO TRADING | Halal Swing Terminal</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Supabase JS (real auth backend) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#0b1120',
            cardDark: '#111827',
            borderDark: '#1e293b',
            accentGreen: '#10b981',
            accentCyan: '#06b6d4',
            accentRed: '#ef4444'
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(16,185,129,0.25), 0 8px 24px -8px rgba(16,185,129,0.35)'
          }
        }
      }
    }
  </script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeSlideIn 0.25s ease-out; }
    ::selection { background: rgba(16,185,129,0.35); }
    input:focus-visible, button:focus-visible { outline: 2px solid #10b981; outline-offset: 2px; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ====== SUPABASE SOZLAMALARI ======
    // Bu ikkalasini o'zingizning Supabase loyihangizdan oling:
    // Supabase Dashboard -> Project Settings -> API
    const SUPABASE_URL = "YOUR_SUPABASE_URL"; // masalan: https://xxxxx.supabase.co
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [currentLang, setCurrentLang] = useState('uz');
      const [currentSymbol, setCurrentSymbol] = useState('AAPL');
      const [searchInput, setSearchInput] = useState('');

      const [news, setNews] = useState([]);
      const [loadingNews, setLoadingNews] = useState(false);
      const [stockPrice, setStockPrice] = useState(313.33);

      // Auth State
      const [user, setUser] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isRegistering, setIsRegistering] = useState(false);
      const [authForm, setAuthForm] = useState({ email: '', password: '', name: '' });
      const [authLoading, setAuthLoading] = useState(false);
      const [authMessage, setAuthMessage] = useState({ type: '', text: '' });

      const top5BuyList = ['NVDA', 'AAPL', 'SPUS', 'MSFT', 'AMZN'];
      const top5SellList = ['TSLA', 'INTC', 'SBUX', 'AMD', 'META'];

      // Supabase sessiyasini kuzatish (sahifa yangilanganda ham saqlanadi)
      useEffect(() => {
        supabase.auth.getSession().then(({ data }) => {
          if (data?.session?.user) {
            setUser({
              email: data.session.user.email,
              name: data.session.user.user_metadata?.name || data.session.user.email.split('@')[0]
            });
          }
          setAuthChecked(true);
        });

        const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session?.user) {
            setUser({
              email: session.user.email,
              name: session.user.user_metadata?.name || session.user.email.split('@')[0]
            });
          } else {
            setUser(null);
          }
        });

        return () => listener?.subscription?.unsubscribe();
      }, []);

      const translations = {
        uz: {
          subtitle: "HALOL SWING TERMINAL",
          chartTitle: "DCT Grafik Tahlil",
          buyTitle: "TOP 5 BUY Signallar",
          sellTitle: "TOP 5 SELL Signallar",
          analysisTitle: "Bozor Tahlili va Signal",
          entry: "KIRISH NUQTASI",
          tp: "TEYK PROFIT",
          sl: "STOP LOSS",
          techLabel: "Texnik Tahlil:",
          techText: "Narx konsolidatsiya zonasida, aniq trend shakllanmaguncha kutgan ma'qul.",
          fundLabel: "Fundamental Tahlil:",
          fundText: "Bozorda noaniqlik va ehtiyotkorlik ustunlik qilmoqda.",
          newsTitle: "DCT Bozor Yangiliklari",
          searchPlaceholder: "Aksiya tikerni kiriting (masalan: AAPL, NVDA)...",
          readMore: "Batafsil o'qish",
          loading: "Yuklanmoqda...",
          noNews: "Yangiliklar topilmadi.",
          loginBtn: "Kirish",
          logoutBtn: "Chiqish",
          authModalTitleLogin: "Tizimga kirish",
          authModalTitleReg: "Ro'yxatdan o'tish",
          nameLabel: "Ismingiz",
          emailLabel: "Email manzil",
          passLabel: "Parol",
          noAccount: "Hisobingiz yo'qmi? Ro'yxatdan o'ting",
          hasAccount: "Hisobingiz bormi? Tizimga kiring",
          confirmEmail: "Ro'yxatdan o'tdingiz! Emailingizni tasdiqlang, so'ng tizimga kiring."
        },
        ru: {
          subtitle: "ХАЛЯЛЬ СВИНГ ТЕРМИНАЛ",
          chartTitle: "DCT График Анализ",
          buyTitle: "ТОП 5 BUY Сигналы",
          sellTitle: "ТОП 5 SELL Сигналы",
          analysisTitle: "Анализ Рынка и Сигнал",
          entry: "ТОЧКА ВХОДА",
          tp: "ТЕЙК ПРОФИТ",
          sl: "СТОП ЛОСС",
          techLabel: "Технический Анализ:",
          techText: "Цена в зоне консолидации, лучше подождать четкого тренда.",
          fundLabel: "Фундаментальный Анализ:",
          fundText: "На рынке преобладает неопределенность и осторожность.",
          newsTitle: "DCT Новости Рынка",
          searchPlaceholder: "Введите тикер (например: AAPL, NVDA)...",
          readMore: "Читать далее",
          loading: "Загрузка...",
          noNews: "Новости не найдены.",
          loginBtn: "Войти",
          logoutBtn: "Выйти",
          authModalTitleLogin: "Вход в систему",
          authModalTitleReg: "Регистрация",
          nameLabel: "Ваше имя",
          emailLabel: "Email адрес",
          passLabel: "Пароль",
          noAccount: "Нет аккаунта? Зарегистрируйтесь",
          hasAccount: "Уже есть аккаунт? Войдите",
          confirmEmail: "Регистрация прошла! Подтвердите email, затем войдите."
        },
        en: {
          subtitle: "HALAL SWING TERMINAL",
          chartTitle: "DCT Chart Analysis",
          buyTitle: "TOP 5 BUY Signals",
          sellTitle: "TOP 5 SELL Signals",
          analysisTitle: "Market Analysis & Signal",
          entry: "ENTRY POINT",
          tp: "TAKE PROFIT",
          sl: "STOP LOSS",
          techLabel: "Technical Analysis:",
          techText: "Price is in consolidation zone, better to wait for a clear trend.",
          fundLabel: "Fundamental Analysis:",
          fundText: "Uncertainty prevails in the market.",
          newsTitle: "DCT Market News",
          searchPlaceholder: "Enter ticker (e.g. AAPL, NVDA)...",
          readMore: "Read more",
          loading: "Loading...",
          noNews: "No news found.",
          loginBtn: "Login",
          logoutBtn: "Logout",
          authModalTitleLogin: "Sign In",
          authModalTitleReg: "Create Account",
          nameLabel: "Your Name",
          emailLabel: "Email Address",
          passLabel: "Password",
          noAccount: "Don't have an account? Register",
          hasAccount: "Already have an account? Login",
          confirmEmail: "Registered! Please confirm your email, then log in."
        }
      };

      const t = translations[currentLang];

      useEffect(() => {
        fetchData(currentSymbol, currentLang);
      }, [currentSymbol, currentLang]);

      async function fetchData(symbol, lang) {
        setLoadingNews(true);
        try {
          const res = await fetch(`/api/news?symbol=${symbol}&lang=${lang}`);
          const data = await res.json();
          if (data.news) setNews(data.news);
          if (data.price) setStockPrice(data.price);
        } catch (err) {
          console.error(err);
        }
        setLoadingNews(false);
      }

      function handleSearch(e) {
        if (e.key === 'Enter' && searchInput) {
          setCurrentSymbol(searchInput.toUpperCase());
        }
      }

      // LOGIN / RO'YXATDAN O'TISH — endi Supabase Auth orqali (real backend)
      async function handleAuthSubmit(e) {
        e.preventDefault();
        setAuthLoading(true);
        setAuthMessage({ type: '', text: '' });

        try {
          if (isRegistering) {
            const { data, error } = await supabase.auth.signUp({
              email: authForm.email,
              password: authForm.password,
              options: { data: { name: authForm.name } }
            });
            if (error) throw error;

            // Agar Supabase'da "Confirm email" yoqilgan bo'lsa, session bo'lmaydi
            if (!data.session) {
              setAuthMessage({ type: 'success', text: t.confirmEmail });
              setAuthLoading(false);
              return;
            }
            setAuthMessage({ type: 'success', text: "Muvaffaqiyatli ro'yxatdan o'tdingiz!" });
          } else {
            const { error } = await supabase.auth.signInWithPassword({
              email: authForm.email,
              password: authForm.password
            });
            if (error) throw error;
            setAuthMessage({ type: 'success', text: "Tizimga kirdingiz!" });
          }

          setTimeout(() => {
            setShowAuthModal(false);
            setAuthForm({ email: '', password: '', name: '' });
            setAuthMessage({ type: '', text: '' });
          }, 800);

        } catch (err) {
          setAuthMessage({ type: 'error', text: err.message || "Xatolik yuz berdi" });
        } finally {
          setAuthLoading(false);
        }
      }

      async function handleLogout() {
        await supabase.auth.signOut();
      }

      const entryPrice = stockPrice ? stockPrice.toFixed(2) : "313.33";
      const tpPrice = stockPrice ? (stockPrice * 1.05).toFixed(2) : "329.00";
      const slPrice = stockPrice ? (stockPrice * 0.95).toFixed(2) : "297.66";

      return (
        <div className="max-w-5xl mx-auto px-4 py-4 space-y-5">

          {/* Header */}
          <header className="flex justify-between items-center bg-cardDark/80 p-3.5 rounded-xl border border-borderDark flex-wrap gap-3">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center font-extrabold text-emerald-400 text-sm">
                DCT
              </div>
              <div>
                <h1 className="text-base font-bold text-emerald-400 tracking-wide">DEDCO TRADING</h1>
                <p className="text-[10px] text-slate-400 font-medium tracking-wider">{t.subtitle}</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {!authChecked ? (
                <div className="w-16 h-6 rounded-lg bg-slate-800/60 animate-pulse"></div>
              ) : user ? (
                <div className="flex items-center gap-2 bg-slate-900 border border-borderDark px-3 py-1.5 rounded-lg animate-in">
                  <div className="w-5 h-5 rounded-full bg-emerald-500/20 flex items-center justify-center">
                    <i className="fa-solid fa-user text-emerald-400 text-[9px]"></i>
                  </div>
                  <span className="text-xs font-semibold text-slate-200">{user.name}</span>
                  <button onClick={handleLogout} className="text-[10px] text-rose-400 ml-1 hover:text-rose-300 transition" title={t.logoutBtn}>
                    <i className="fa-solid fa-right-from-bracket"></i>
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="bg-emerald-500/20 hover:bg-emerald-500/30 hover:shadow-glow text-emerald-400 border border-emerald-500/40 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5"
                >
                  <i className="fa-solid fa-right-to-bracket text-[10px]"></i>
                  {t.loginBtn}
                </button>
              )}

              <div className="flex bg-slate-900/90 p-1 rounded-lg border border-borderDark text-xs font-semibold">
                {['uz', 'ru', 'en'].map(lang => (
                  <button
                    key={lang}
                    onClick={() => setCurrentLang(lang)}
                    className={`px-2.5 py-1 rounded-md uppercase transition ${currentLang === lang ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    {lang}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Chart Section */}
          <section className="bg-cardDark p-4 rounded-xl border border-borderDark">
            <h2 className="text-sm font-bold text-slate-200 mb-3">{t.chartTitle}</h2>
            <div className="w-full h-[400px] rounded-lg overflow-hidden border border-borderDark">
              <iframe
                src={`https://s.tradingview.com/widgetembed/?frameElementId=tradingview_1&symbol=${currentSymbol}&interval=D&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC`}
                className="w-full h-full border-0"
              ></iframe>
            </div>
          </section>

          {/* Analysis Box */}
          <section className="bg-cardDark p-4 rounded-xl border border-emerald-500/40 space-y-4">
            <div className="flex items-center gap-2 text-emerald-400 font-bold text-xs">
              <i className="fa-solid fa-circle-check text-[10px]"></i>
              <span>{currentSymbol} {t.analysisTitle}</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div className="bg-slate-900/60 p-3 rounded-lg border border-borderDark text-center hover:border-emerald-500/30 transition">
                <p className="text-[10px] text-slate-400 font-semibold">{t.entry}</p>
                <p className="text-emerald-400 font-bold text-base mt-1">${entryPrice}</p>
              </div>
              <div className="bg-slate-900/60 p-3 rounded-lg border border-borderDark text-center hover:border-cyan-500/30 transition">
                <p className="text-[10px] text-slate-400 font-semibold">{t.tp}</p>
                <p className="text-cyan-400 font-bold text-base mt-1">${tpPrice}</p>
              </div>
              <div className="bg-slate-900/60 p-3 rounded-lg border border-borderDark text-center hover:border-rose-500/30 transition">
                <p className="text-[10px] text-slate-400 font-semibold">{t.sl}</p>
                <p className="text-rose-400 font-bold text-base mt-1">${slPrice}</p>
              </div>
            </div>

            <div className="text-[11px] space-y-1 text-slate-300 pt-1">
              <p><strong className="text-emerald-400">● {t.techLabel}</strong> {t.techText}</p>
              <p><strong className="text-cyan-400">● {t.fundLabel}</strong> {t.fundText}</p>
            </div>
          </section>

          {/* Signals */}
          <section className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
              <h3 className="text-xs font-bold text-emerald-400 flex items-center gap-2">
                <i className="fa-solid fa-arrow-trend-up"></i> {t.buyTitle}
              </h3>
              <div className="space-y-2">
                {top5BuyList.map((sym) => (
                  <div
                    key={sym}
                    onClick={() => setCurrentSymbol(sym)}
                    className="bg-slate-900/80 p-2.5 rounded-lg border border-borderDark hover:border-emerald-500/50 hover:bg-slate-900 transition cursor-pointer flex justify-between items-center text-xs"
                  >
                    <span className="font-bold text-slate-200">{sym}</span>
                    <div className="font-mono text-[11px] space-x-2">
                      <span className="text-emerald-400">Entry: ${(stockPrice ? (stockPrice * 0.98).toFixed(2) : '307.06')}</span>
                      <span className="text-cyan-400">TP: ${(stockPrice ? (stockPrice * 1.06).toFixed(2) : '332.13')}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
              <h3 className="text-xs font-bold text-rose-400 flex items-center gap-2">
                <i className="fa-solid fa-arrow-trend-down"></i> {t.sellTitle}
              </h3>
              <div className="space-y-2">
                {top5SellList.map((sym) => (
                  <div
                    key={sym}
                    onClick={() => setCurrentSymbol(sym)}
                    className="bg-slate-900/80 p-2.5 rounded-lg border border-borderDark hover:border-rose-500/50 hover:bg-slate-900 transition cursor-pointer flex justify-between items-center text-xs"
                  >
                    <span className="font-bold text-slate-200">{sym}</span>
                    <div className="font-mono text-[11px] space-x-2">
                      <span className="text-rose-400">Entry: ${(stockPrice ? (stockPrice * 1.02).toFixed(2) : '319.60')}</span>
                      <span className="text-slate-400">SL: ${(stockPrice ? (stockPrice * 1.08).toFixed(2) : '338.40')}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* News */}
          <section className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
            <h2 className="text-xs font-bold text-slate-200 flex items-center gap-2">
              <i className="fa-solid fa-newspaper text-cyan-400"></i> {t.newsTitle} ({currentSymbol})
            </h2>

            <input
              type="text"
              placeholder={t.searchPlaceholder}
              value={searchInput}
              onChange={e => setSearchInput(e.target.value)}
              onKeyDown={handleSearch}
              className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-emerald-500 transition"
            />

            <div className="space-y-3 pt-2">
              {loadingNews ? (
                <p className="text-xs text-slate-400 py-4 text-center"><i className="fa-solid fa-spinner fa-spin mr-1"></i> {t.loading}</p>
              ) : news.length > 0 ? (
                news.map((item) => (
                  <div key={item.id} className="p-3 bg-slate-900/60 rounded-lg border border-borderDark space-y-1.5 hover:border-slate-600 transition">
                    <h4 className="font-bold text-xs text-slate-200 leading-snug">{item.headline}</h4>
                    <p className="text-[11px] text-slate-400 leading-relaxed line-clamp-2">{item.summary}</p>
                    <div className="pt-1 flex justify-between items-center text-[10px]">
                      <span className="text-slate-500">{new Date(item.datetime * 1000).toLocaleDateString()}</span>
                      <a href={item.url} target="_blank" rel="noreferrer" className="text-emerald-400 font-semibold hover:underline flex items-center gap-1">
                        {t.readMore} <i className="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                      </a>
                    </div>
                  </div>
                ))
              ) : (
                <p className="text-xs text-slate-500 py-2 text-center">{t.noNews}</p>
              )}
            </div>
          </section>

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-cardDark border border-borderDark rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl relative animate-in">

                <button
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-3 right-3 text-slate-400 hover:text-slate-200 text-sm transition"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center">
                    <i className="fa-solid fa-shield-halved text-emerald-400 text-[10px]"></i>
                  </div>
                  <h3 className="text-sm font-bold text-emerald-400">
                    {isRegistering ? t.authModalTitleReg : t.authModalTitleLogin}
                  </h3>
                </div>

                {authMessage.text && (
                  <div className={`text-xs p-2.5 rounded-lg border animate-in ${
                    authMessage.type === 'error'
                      ? 'bg-rose-500/10 border-rose-500/30 text-rose-400'
                      : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
                  }`}>
                    {authMessage.text}
                  </div>
                )}

                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  {isRegistering && (
                    <div>
                      <label className="text-slate-400 block mb-1">{t.nameLabel}</label>
                      <input
                        type="text"
                        required
                        value={authForm.name}
                        onChange={e => setAuthForm({...authForm, name: e.target.value})}
                        className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-slate-200 outline-none focus:border-emerald-500 transition"
                      />
                    </div>
                  )}

                  <div>
                    <label className="text-slate-400 block mb-1">{t.emailLabel}</label>
                    <input
                      type="email"
                      required
                      value={authForm.email}
                      onChange={e => setAuthForm({...authForm, email: e.target.value})}
                      className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-slate-200 outline-none focus:border-emerald-500 transition"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">{t.passLabel}</label>
                    <input
                      type="password"
                      required
                      minLength={6}
                      value={authForm.password}
                      onChange={e => setAuthForm({...authForm, password: e.target.value})}
                      className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-slate-200 outline-none focus:border-emerald-500 transition"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={authLoading}
                    className="w-full bg-emerald-500 hover:bg-emerald-400 disabled:opacity-60 text-slate-950 font-bold py-2 rounded-lg transition mt-2 flex items-center justify-center gap-2"
                  >
                    {authLoading && <i className="fa-solid fa-spinner fa-spin"></i>}
                    {isRegistering ? t.authModalTitleReg : t.authModalTitleLogin}
                  </button>
                </form>

                <div className="text-center pt-2 border-t border-borderDark">
                  <button
                    onClick={() => { setIsRegistering(!isRegistering); setAuthMessage({ type: '', text: '' }); }}
                    className="text-[11px] text-cyan-400 hover:underline"
                  >
                    {isRegistering ? t.hasAccount : t.noAccount}
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
