    const FRAME_COLORS = ['transparent', '#cd7f32', '#c0c0c0', '#ffd700', '#67e8f9', '#a78bfa', '#f472b6'];
    function frameColor(tier) {
      const t = parseInt(tier, 10) || 0;
      return FRAME_COLORS[Math.min(t, FRAME_COLORS.length - 1)];
    }

    function isMarketOpenNow() {
      const now = new Date();
      const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
      const tashkent = new Date(utcMs + 5 * 60 * 60000);
      const day = tashkent.getDay();
      const hour = tashkent.getHours();
      if (day === 0 || day === 6) return false;
      return hour >= 9 && hour < 18;
    }

      useEffect(() => {
        if (!candles.length || !chartCanvasRef.current || !window.LightweightCharts) return;

        const container = chartCanvasRef.current;
        if (chartInstanceRef.current) {
          chartInstanceRef.current.remove();
          chartInstanceRef.current = null;
        }

        // Konteyner hali kenglik olmagan bo'lishi mumkin (birinchi render) — biroz kutib qayta urinamiz
        if (container.clientWidth === 0) {
          const retry = setTimeout(() => setCandles(c => [...c]), 100);
          return () => clearTimeout(retry);
        }

        const chart = window.LightweightCharts.createChart(container, {
          layout: { background: { color: 'transparent' }, textColor: '#94a3b8' },
          grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
          width: container.clientWidth,
          height: 300,
          timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#1e293b' },
          rightPriceScale: { borderColor: '#1e293b' }
        });

        const candleSeries = chart.addCandlestickSeries({
          upColor: '#10b981', downColor: '#ef4444',
          borderUpColor: '#10b981', borderDownColor: '#ef4444',
          wickUpColor: '#10b981', wickDownColor: '#ef4444',
          priceScaleId: 'right'
        });
        candleSeries.priceScale().applyOptions({ scaleMargins: { top: 0.1, bottom: 0.3 } });
        candleSeries.setData(candles.map((c) => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));

        const volumeSeries = chart.addHistogramSeries({
          priceFormat: { type: 'volume' },
          priceScaleId: 'volume'
        });
        volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
        volumeSeries.setData(candles.map((c) => ({
          time: c.time, value: c.volume,
          color: c.close >= c.open ? 'rgba(16,185,129,0.5)' : 'rgba(239,68,68,0.5)'
        })));

        chart.timeScale().fitContent();
        chartInstanceRef.current = chart;

        const resizeObserver = new ResizeObserver((entries) => {
          if (!entries.length || !chartInstanceRef.current) return;
          const { width } = entries[0].contentRect;
          if (width > 0) chartInstanceRef.current.applyOptions({ width });
        });
        resizeObserver.observe(container);

        return () => { resizeObserver.disconnect(); chart.remove(); };
      }, [candles]);

      async function handleTrade(stockId, type) {
        setTradeLoading(stockId + type);
        setTradeMsg({ type: '', text: '' });
        try {
          const token = await getAuthToken();
          if (!token) {
            setTradeMsg({ type: 'error', text: t.loginToTrade });
            setTradeLoading(null);
            return;
          }
          const qty = parseInt(tradeQty[stockId] || '1', 10);
          const orderType = orderTypeSel[stockId] || 'market';
          const targetPrice = targetPriceInput[stockId];
          const res = await fetch('/api/trade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ stock_id: stockId, type, quantity: qty, order_type: orderType, target_price: targetPrice })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Xatolik');

          if (data.pending) {
            setTradeMsg({ type: 'success', text: "Buyurtma qo'yildi, bajarilishini kutmoqda." });
          } else {
            const amountText = `$${parseFloat(data.total).toFixed(2)}`;
            const levelUpText = data.leveledUp ? ` 🎉 Level ${data.newLevel}ga o'tdingiz!` : '';
            setTradeMsg({
              type: 'success',
              text: (type === 'buy'
                ? `Sotib olindi: ${qty} dona, ${amountText} balansdan yechildi.`
                : `Sotildi: ${qty} dona, ${amountText} balansga qo'shildi.`) + levelUpText
            });
            // Balans, EXP va levelni kutmasdan darhol yangilaymiz
            if (data.newBalance !== undefined) {
              setPortfolio(prev => ({
                ...prev,
                balance: data.newBalance,
                exp: data.newExp ?? prev.exp,
                level: data.newLevel ?? prev.level,
                expInLevel: data.newExp !== undefined ? data.newExp % 100 : prev.expInLevel,
                maxUnlockedTier: data.newLevel !== undefined ? Math.floor(data.newLevel / 5) : prev.maxUnlockedTier
              }));
            }
          }

          if (selectedStockId) {
            fetchStockDetail(selectedStockId);
            fetchCandles(selectedStockId, candleInterval);
            fetchMyOpenOrders(selectedStockId);
          } else {
            fetchStocks();
          }
          fetchPortfolio();
        } catch (err) {
          setTradeMsg({ type: 'error', text: err.message });
        }
        setTradeLoading(null);
      }

                              const qty = parseFloat(myHolding.quantity);
                              const avgCost = parseFloat(myHolding.avg_cost || 0);
                              const unrealizedProfit = Math.max(0, (parseFloat(s.current_price) - avgCost) * qty);

                              if (purificationDue <= 0) return null;

                                </div>

                                  onClick={() => setTradeSide({ ...tradeSide, [s.id]: 'sell' })}

                                {[
                                  { key: 'market', label: t.orderMarketShort },
                                  { key: 'limit', label: t.orderLimitShort },
                                  { key: 'stop_loss', label: t.orderSlShort },
                                  { key: 'take_profit', label: t.orderTpShort }

                                  <button
                                    key={ot.key}

                                  <div className="space-y-2">
                                    <textarea
                                      value={descDraft} maxLength={500}

                                  <button
                                    onClick={() => { setEditingDesc(true); setHaramPctDraft(String(m.haramPct || 0)); }}
                                    className="text-[11px] text-cyan-400 hover:underline"

                                    {t.editDesc} {t.descLabel.toLowerCase()}

                                )}

                            {/* BOTTOM: Open orders */}
                            {user && (
                              <div className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-2">
                                <h4 className="text-xs font-bold text-slate-200 flex items-center gap-2">
                                  <i className="fa-solid fa-hourglass-half"></i> {t.myOpenOrders}
                                </h4>
                                {myOpenOrders.length > 0 ? (
                                  <div className="space-y-1.5">
                                    {myOpenOrders.map((o) => (
                                      <div key={o.id} className="flex justify-between items-center text-[11px] bg-slate-900/60 px-3 py-2 rounded-lg">
                                        <span className={o.side === 'buy' ? 'text-emerald-400' : 'text-rose-400'}>
                                          {o.order_type} · {o.quantity} @ ${parseFloat(o.target_price).toFixed(2)}
                                        </span>
                                        <button onClick={() => handleCancelOrder(o.id)} className="text-slate-500 hover:text-rose-400 transition text-[10px]">

                                  <p className="text-xs text-slate-500 py-2 text-center">{t.noOpenOrders}</p>

                                <h4 className="text-xs font-bold text-slate-200 flex items-center gap-2">
                                  <i className="fa-solid fa-clock-rotate-left"></i> {t.activityFeed}
                                  <span className="text-slate-600 font-normal">({t.ownerOnly})</span>
                                </h4>
                                {stockDetail.activity.length > 0 ? (
                                  <React.Fragment>
                                    <div className="space-y-1.5">
                                      {(showAllActivity ? stockDetail.activity : stockDetail.activity.slice(0, 5)).map((a, idx) => (
                                        <div key={idx} className="flex justify-between items-center text-[11px] bg-slate-900/60 px-3 py-2 rounded-lg">
                                          <span className={a.type === 'buy' ? 'text-emerald-400' : 'text-rose-400'}>
                                            {a.is_bot && <i className="fa-solid fa-robot mr-1 text-slate-500" title={t.botTrade}></i>}

                                          </span>
                                          <span className="text-slate-500">${parseFloat(a.price).toFixed(2)}</span>
                                        </div>

                                      <button
                                        onClick={() => setShowAllActivity(!showAllActivity)}
                                        className="text-[11px] text-cyan-400 hover:underline w-full text-center pt-1"

                                        {showAllActivity ? t.showLess : t.showMore}
                                      </button>
                                    )}
                                  </React.Fragment>
                                ) : (
                                  <p className="text-xs text-slate-500 py-2 text-center">{t.noActivity}</p>
                                )}
                              </div>
                            )}
                          </React.Fragment>
                        );
                      })()}
                    </React.Fragment>
                  )}
                </section>
              )}
            </div>
          )}

          {/* ============ PORTFOLIO TAB ============ */}
          {activeTab === 'portfolio' && (
            <div className="space-y-5 animate-in">
              {!user ? (
                <section className="bg-cardDark p-6 rounded-xl border border-borderDark text-center">
                  <p className="text-xs text-slate-500">{t.loginToTrade}</p>
                </section>
              ) : (
                <React.Fragment>
                  <section className="bg-cardDark p-4 rounded-xl border border-amber-500/30 space-y-2">
                    <div className="flex justify-between items-center">
                      <div className="flex items-center gap-2">
                        <div
                          className="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center"
                          style={{ boxShadow: `0 0 0 3px ${frameColor(portfolio.activeFrame)}` }}
                        >
                          <i className="fa-solid fa-user text-slate-400"></i>
                        </div>
                        <div>
                          <p className="text-sm font-bold text-slate-100">Lv.{portfolio.level} — {portfolio.rank}</p>
                          <p className="text-[10px] text-slate-500">{portfolio.expInLevel}/{portfolio.expForNextLevel} EXP</p>
                        </div>
                      </div>
                    </div>
                    <div className="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden">
                      <div
                        className="h-full bg-amber-400 transition-all"
                        style={{ width: `${(portfolio.expInLevel / portfolio.expForNextLevel) * 100}%` }}
                      ></div>
                    </div>
                    {portfolio.maxUnlockedTier > 0 && (
                      <div className="pt-2 border-t border-borderDark/50">
                        <p className="text-[10px] text-slate-500 mb-1.5">{t.frameSelectLabel}</p>
                        <div className="flex gap-2 flex-wrap">
                          {Array.from({ length: portfolio.maxUnlockedTier + 1 }, (_, tier) => (
                            <button
                              key={tier}
                              onClick={() => handleSelectFrame(tier)}
                              className="w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center transition"
                              style={{ boxShadow: `0 0 0 2px ${frameColor(tier)}`, opacity: String(tier) === portfolio.activeFrame ? 1 : 0.5 }}
                            >
                              <i className="fa-solid fa-user text-slate-400 text-[10px]"></i>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </section>

                  <section className="bg-cardDark p-4 rounded-xl border border-emerald-500/40 text-center">
                    <p className="text-[10px] text-slate-400 font-semibold">{t.yourBalance}</p>
                    <p className="text-emerald-400 font-bold text-2xl mt-1">
                      {loadingPortfolio ? <i className="fa-solid fa-spinner fa-spin text-base"></i> : `$${parseFloat(portfolio.balance).toFixed(2)}`}
                    </p>
                  </section>

                  <section className="bg-cardDark p-4 rounded-xl border border-borderDark space-y-3">
                    <h3 className="text-xs font-bold text-slate-200 flex items-center gap-2">
                      <i className="fa-solid fa-briefcase"></i> {t.yourHoldings}
                    </h3>
                    {loadingPortfolio ? (
                      <p className="text-xs text-slate-400 py-4 text-center"><i className="fa-solid fa-spinner fa-spin mr-1"></i> {t.loading}</p>
                    ) : portfolio.holdings.length > 0 ? (
                      <div className="space-y-2">
                        {portfolio.holdings.map((h) => {
                          const qty = parseFloat(h.quantity);
                          const currentPrice = parseFloat(h.user_stocks?.current_price || 0);
                          const avgCost = parseFloat(h.avg_cost || 0);
                          const currentValue = qty * currentPrice;
                          const unrealizedPl = (currentPrice - avgCost) * qty;
                          const realizedPl = parseFloat(h.realized_pl || 0);
                          const plColor = unrealizedPl >= 0 ? 'text-emerald-400' : 'text-rose-400';
                          return (
                            <div key={h.id} className="bg-slate-900/70 p-3 rounded-lg border border-borderDark space-y-1">
                              <div className="flex justify-between items-center">
                                <div>
                                  <span className="font-bold text-slate-200 text-xs">{h.user_stocks?.ticker}</span>
                                  <span className="text-slate-500 text-[10px] ml-2">{qty} {t.shares} · {t.avgCostLabel} ${avgCost.toFixed(2)}</span>
                                </div>
                                <span className="text-slate-200 font-bold text-xs">${currentValue.toFixed(2)}</span>
                              </div>
                              <div className="flex justify-between items-center text-[10px]">
                                <span className={plColor}>
                                  {t.unrealizedPl}: {unrealizedPl >= 0 ? '+' : ''}${unrealizedPl.toFixed(2)}
                                </span>
                                {realizedPl !== 0 && (
                                  <span className={realizedPl >= 0 ? 'text-emerald-400' : 'text-rose-400'}>
                                    {t.realizedPl}: {realizedPl >= 0 ? '+' : ''}${realizedPl.toFixed(2)}
                                  </span>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      <p className="text-xs text-slate-500 py-2 text-center">{t.noHoldings}</p>
                    )}
                  </section>

                  {/* Zakat Calculator */}
                  {(() => {
                    const holdingsValue = portfolio.holdings.reduce((sum, h) => sum + parseFloat(h.quantity) * parseFloat(h.user_stocks?.current_price || 0), 0);
                    const totalWealth = parseFloat(portfolio.balance) + holdingsValue;
                    const zakatDue = totalWealth * 0.025;
                    return (
                      <section className="bg-cardDark p-4 rounded-xl border border-cyan-500/40 space-y-2">
                        <h3 className="text-xs font-bold text-cyan-400 flex items-center gap-2">
                          <i className="fa-solid fa-mosque"></i> {t.zakatTitle}
                        </h3>
                        <p className="text-[10px] text-slate-400">{t.zakatNote}</p>
                        <div className="flex justify-between items-center bg-slate-900/60 px-3 py-2 rounded-lg">
                          <span className="text-[11px] text-slate-400">{t.totalWealth}</span>
                          <span className="text-slate-200 font-bold text-xs">${totalWealth.toFixed(2)}</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <div>
                            <p className="text-[10px] text-slate-500">{t.zakatDue} (2.5%)</p>
                            <p className="text-cyan-400 font-bold text-lg">${zakatDue.toFixed(2)}</p>
                          </div>
                          <button
                            onClick={() => handleCharityDonation('zakat', zakatDue, null)}
                            disabled={charityLoading || zakatDue <= 0 || zakatDue > parseFloat(portfolio.balance)}
                            className="bg-cyan-500/20 hover:bg-cyan-500/30 disabled:opacity-40 text-cyan-400 border border-cyan-500/40 px-4 py-2 rounded-lg text-xs font-bold transition"
                          >
                            {t.donateBtn}
                          </button>
                        </div>
                      </section>
                    );
                  })()}

                  {portfolio.totalCharityGiven > 0 && (
                    <section className="bg-amber-500/10 p-3 rounded-xl border border-amber-500/30 text-center">
                      <p className="text-[11px] text-amber-400">
                        <i className="fa-solid fa-hand-holding-heart mr-1"></i> {t.totalCharityLabel}: <strong>${parseFloat(portfolio.totalCharityGiven).toFixed(2)}</strong>
                      </p>
                    </section>
                  )}
                </React.Fragment>
              )}
            </div>
          )}

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-cardDark border border-borderDark rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl relative animate-in">

                <button
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-3 right-3 text-slate-400 hover:text-slate-200 text-sm transition"
                >
                  <i className="fa-solid fa-xmark"></i>
                </button>

                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center">
                    <i className="fa-solid fa-shield-halved text-emerald-400 text-[10px]"></i>
                  </div>
                  <h3 className="text-sm font-bold text-emerald-400">
                    {isRegistering ? t.authModalTitleReg : t.authModalTitleLogin}
                  </h3>
                </div>

                {authMessage.text && (
                  <div className={`text-xs p-2.5 rounded-lg border animate-in ${
                    authMessage.type === 'error'
                      ? 'bg-rose-500/10 border-rose-500/30 text-rose-400'
                      : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'
                  }`}>
                    {authMessage.text}
                  </div>
                )}

                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  {isRegistering && (
                    <div>
                      <label className="text-slate-400 block mb-1">{t.nameLabel}</label>
                      <input
                        type="text"
                        required
                        value={authForm.name}
                        onChange={e => setAuthForm({...authForm, name: e.target.value})}
                        className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-slate-200 outline-none focus:border-emerald-500 transition"
                      />
                    </div>
                  )}

                  <div>
                    <label className="text-slate-400 block mb-1">{t.emailLabel}</label>
                    <input
                      type="email"
                      required
                      value={authForm.email}
                      onChange={e => setAuthForm({...authForm, email: e.target.value})}
                      className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-slate-200 outline-none focus:border-emerald-500 transition"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">{t.passLabel}</label>
                    <input
                      type="password"
                      required
                      minLength={6}
                      value={authForm.password}
                      onChange={e => setAuthForm({...authForm, password: e.target.value})}
                      className="w-full bg-slate-900 border border-borderDark rounded-lg px-3 py-2 text-slate-200 outline-none focus:border-emerald-500 transition"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={authLoading}
                    className="w-full bg-emerald-500 hover:bg-emerald-400 disabled:opacity-60 text-slate-950 font-bold py-2 rounded-lg transition mt-2 flex items-center justify-center gap-2"
                  >
                    {authLoading && <i className="fa-solid fa-spinner fa-spin"></i>}
                    {isRegistering ? t.authModalTitleReg : t.authModalTitleLogin}
                  </button>
                </form>

                <div className="text-center pt-2 border-t border-borderDark">
                  <button
                    onClick={() => { setIsRegistering(!isRegistering); setAuthMessage({ type: '', text: '' }); }}
                    className="text-[11px] text-cyan-400 hover:underline"
                  >
                    {isRegistering ? t.hasAccount : t.noAccount}
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
  </html>
